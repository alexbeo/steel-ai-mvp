id: en10083_qt
name: "Q&T Carbon Steels — EN 10083-2 carbon grades (C22/C35/C45/C60)"
standard: "EN 10083-2 (carbon-only subset)"
# SCOPE NOTE (R-006 audit finding B-3):
#   This class covers ONLY the carbon Q&T grades C22/C35/C45/C60 from
#   EN 10083-2. Full EN 10083-2 also includes alloyed grades:
#     - EN 10083-3: 25CrMo4, 42CrMo4 (Cr-Mo) — needs mo_pct
#     - EN 10083-3: 34CrNiMo6, 36NiCrMo16 (Cr-Ni-Mo) — needs ni_pct, mo_pct
#     - EN 10083-3: 51CrV4 (spring) — needs v_pct
#   To add alloyed grade support: extend feature_set with mo_pct/ni_pct/v_pct,
#   add physical_bounds for those, update synthetic generator in data_curator
#   to model their hardenability contribution. Out of MVP scope; tracked as
#   future work via R-004.
target_properties:
  - id: hardness_hrc
    label: "Твёрдость, HRC"
    range: [20, 65]
  - id: tensile_strength_mpa
    label: "σв, МПа"
    range: [500, 1500]
feature_set:
  - c_pct
  - si_pct
  - mn_pct
  - p_pct
  - s_pct
  - cr_pct
  - austenitizing_temp
  - tempering_temp
  - tempering_time_min
  - section_thickness_mm
physical_bounds:
  c_pct: [0.18, 0.65]
  si_pct: [0.15, 0.40]
  mn_pct: [0.40, 0.80]
  p_pct: [0.0, 0.035]
  s_pct: [0.0, 0.035]
  cr_pct: [0.0, 0.40]
  austenitizing_temp: [820.0, 900.0]
  tempering_temp: [150.0, 650.0]
  tempering_time_min: [30.0, 180.0]
  section_thickness_mm: [10.0, 100.0]
expected_top_features:
  - c_pct
  - tempering_temp
  - austenitizing_temp
  - mn_pct
  - section_thickness_mm
process_params:
  - austenitizing_temp
  - tempering_temp
  - tempering_time_min
  - section_thickness_mm
synthetic_generator_name: en10083_qt
cost_seed_path: data/prices/seed_2026-04-26.yaml
feature_engineering: passthrough
target_o_activity_ppm: 15.0
