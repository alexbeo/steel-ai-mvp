# Heat Record column aliases for Excel ETL.
# Auto-detector matches normalized excel column names (lowercase, alnum_)
# against these aliases. Operator can override via --mapping-file in CLI.
# Maintained as alias list per field — synonyms in RU/EN/PL/DE/IT (transliterated).
# Aliases are pre-normalized at load time (_normalize_column_name).

